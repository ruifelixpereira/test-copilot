<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Calendar</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>&#128197; Event Calendar</h1>
    </header>

    <main class="main-content">
      <!-- Calendar Panel -->
      <section class="calendar-panel">
        <div class="calendar-nav">
          <button id="prev-month" class="nav-btn" aria-label="Previous month">&#8592;</button>
          <h2 id="month-label">March 2026</h2>
          <button id="next-month" class="nav-btn" aria-label="Next month">&#8594;</button>
        </div>

        <div class="calendar-grid">
          <div class="day-header">Sun</div>
          <div class="day-header">Mon</div>
          <div class="day-header">Tue</div>
          <div class="day-header">Wed</div>
          <div class="day-header">Thu</div>
          <div class="day-header">Fri</div>
          <div class="day-header">Sat</div>
        </div>

        <div id="calendar-body" class="calendar-body"></div>
      </section>

      <!-- Events Panel -->
      <section class="events-panel">
        <h2 id="events-panel-title">Upcoming Events</h2>
        <div id="events-list" class="events-list">
          <p class="no-events">Select a day to view events, or see all upcoming events below.</p>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
